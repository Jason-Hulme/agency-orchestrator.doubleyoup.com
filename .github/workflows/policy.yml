# Policy-as-code CI: run this repo's semgrep rules and conftest policies on every PR and every
# push to main.
#
# Every policy step BLOCKS:
#   * semgrep rule unit tests          — the rules match what their fixtures say they match
#   * semgrep scan with the repo's own rules (.policy-as-code/.semgrep), `--error`
#   * conftest Rego unit tests         — the config policies likewise
#   * conftest policies vs real files  — 0 denials (a `warn` is advisory)
# Do not add `continue-on-error`: a rule that cannot fail a PR is only a suggestion. A real
# exception takes a `nosemgrep: <rule id>` comment with the reason on the matched line.
#
# The job id is `policy` and it has no `name:` override on purpose. The harness waits for the
# check run named `policy` before the security review and the merge.
#
# Supply chain (rule dy-workflow-unpinned-supply-chain, from the security review of infra#160):
# every action is pinned to a full commit SHA with the tag in a comment, semgrep is installed at
# an exact version, and conftest is downloaded at a pinned version and checksum-verified. A
# moving version is an unreviewed change to what "passing" means. `--metrics=off` keeps the scan
# from reporting to semgrep.
#
# THE GATE DEFINITION COMES FROM THE DEFAULT BRANCH, NOT FROM THE PR (hub#495). On `pull_request`, GitHub
# runs the workflow file of the PR's own merge commit, and that file ran the PR's own npm scripts, rules
# and ignore list, so a PR could turn its own `policy` check green. So:
#   * The trigger is `pull_request_target`: GitHub takes this workflow file from the default branch, and
#     the run's check (the job `policy`) is reported on the PR's head commit, where the harness reads it.
#   * `gate/` is a checkout of the default branch (github.sha): the rules, the Rego, the scripts and the
#     .semgrepignore all come from there, and only its scripts run.
#   * `target/` is the PR head, checked out as DATA with no credentials. semgrep and conftest read its
#     files; no npm script, shell script or Rego from it runs. scripts/policy-gate.sh replaces every
#     .semgrepignore in it with the gate's.
#   * The token is read-only and the workflow names no secret, which workflows.rego enforces for every
#     pull_request_target workflow.
#   * The `pull_request` trigger stays as a SECOND run of the same check name, with the PR's own workflow
#     and rules (on that event github.sha is the PR's merge commit). It runs a rule change's own tests
#     before the merge, and it is the run that a PR which first adds this design gets. It cannot hide a
#     failure: the harness needs every `policy` run on the head to pass, so the pull_request_target run
#     decides.
# `scripts/policy-gate-selftest.sh` shows that a target that edits the rules, the scripts, the ignore
# lists or this workflow still fails on a violation.
#
# The same checks run locally: `npm run semgrep:test`, `npm run semgrep:policy`, `npm run conftest:test`,
# `npm run conftest`, and `npm run policy:gate-selftest` for the base-branch property.
#
# `.semgrepignore` skips `.policy-as-code/`: the semgrep rule fixtures contain violations on
# purpose. `semgrep test` is what runs them; the scan must only look at real code. The conftest
# policies need no such exclusion — their fixtures live in `_test.rego` files, which `conftest
# test` evaluates as tests and never as input documents.
#
# There is no `npm ci`: the gate only calls the semgrep and conftest CLIs. @doubleyoup/contracts is a
# private git dependency this job has no reason to fetch.
name: Policy as code

on:
  pull_request_target:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# On pull_request_target, github.ref is the default branch for every PR, so the group is keyed on the PR
# number (else one PR's run would cancel another's), and on the event (else a PR's two runs would cancel
# each other).
concurrency:
  group: policy-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-latest
    env:
      CONFTEST_VERSION: "0.69.0"
      # From the release's own checksums.txt for conftest_0.69.0_Linux_x86_64.tar.gz.
      CONFTEST_SHA256: "96fc2fbf11f0afde51256647127e6f00a64ce839a4d9a0a1aef2426c0e6f4b3f"
    steps:
      # The gate: the default branch on pull_request_target (github.sha is its last commit), or the pushed
      # commit on push.
      - name: Check out the gate (rules, scripts, ignore list)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: gate
          persist-credentials: false

      # The code under test, as data only: nothing in target/ is executed (see the header).
      - name: Check out the code under test (data only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # nosemgrep: dy-gha-target-code-checkout -- data only: semgrep and conftest read these files; no npm script, shell script or Rego from the PR runs, and the token is read-only.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: target
          persist-credentials: false

      - name: Set up Python (semgrep ships as a Python package)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install semgrep
        run: python -m pip install --disable-pip-version-check semgrep==1.183.0

      - name: Install conftest (pinned + checksum-verified)
        run: |
          set -euo pipefail
          url="https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          curl -sSfL -o conftest.tar.gz "$url"
          echo "${CONFTEST_SHA256}  conftest.tar.gz" | sha256sum --check --status \
            || { echo "::error::conftest tarball checksum mismatch — refusing to run an unverified binary."; exit 1; }
          tar -xzf conftest.tar.gz conftest
          install -m 0755 conftest /usr/local/bin/conftest
          rm -f conftest conftest.tar.gz
          conftest --version

      - name: Policy gate (the gate's rules against the code under test)
        run: sh gate/scripts/policy-gate.sh gate target
