# doubleyoup agency-orchestrator Worker.
#
# Deployed by each AGENCY into their OWN Cloudflare account (pulled from our
# GitHub). Phase 1 = onboarding + credential self-validation only — no
# infrastructure provisioning. Uses only Web APIs (fetch + Web Crypto, and
# cloudflare:sockets for the hub#476 SSH ops), so no nodejs_compat flag is needed.
#
# CONFIG lives entirely in Cloudflare vars/secrets — NEVER hardcode a secret here.
#
#   [vars] (public, committed):
#     APP_BASE_URL   our control-plane app base (below)
#     MEDIA_WORKER_SCRIPT  optional (hub#133): the media Worker script the worker-route-* ops route to (default doubleyoup-media)
#     MEDIA_HOSTMAP_KV_ID  optional (hub#133): the id of the HOSTMAP KV namespace (unset = the namespace titled HOSTMAP)
#     MEDIA_ACCOUNT_ID     optional (hub#133): the account of the media Worker + HOSTMAP (unset = the token's only account; refused when the token sees several)
#
#   Secrets (NOT committed — `wrangler secret put <NAME>`; for local `wrangler dev`
#   put them in an untracked .dev.vars — see .dev.vars.example):
#     Direction-A OAuth2 client credentials (issued by our app at onboarding):
#       wrangler secret put DY_CLIENT_ID
#       wrangler secret put DY_CLIENT_SECRET
#     Agency service credentials (the agency's own accounts):
#       wrangler secret put GCP_SERVICE_ACCOUNT_KEY   # the full service-account JSON
#       wrangler secret put S3_ACCESS_KEY_ID
#       wrangler secret put S3_SECRET_ACCESS_KEY
#       wrangler secret put S3_REGION                 # e.g. us-east-1 (or "auto" for R2)
#       wrangler secret put S3_BUCKET
#       wrangler secret put S3_BACKUP_BUCKET          # optional — Tier-1's own UNLOCKED bucket (unset = S3_BUCKET)
#       wrangler secret put S3_ENDPOINT               # optional — set for R2/MinIO/Wasabi
#       wrangler secret put STRIPE_SECRET_KEY
#       wrangler secret put R2_PROVISION_API_TOKEN     # account-owned: Workers R2 Storage: Edit (provision-r2) + Account API Tokens: Edit (hub#43 r2-site-key-install/revoke/state)
#       wrangler secret put CELL_FILE_AGENT_URL        # OPTIONAL fallback (hub#43): the FILE-node cell-agent (set-r2-target). Not needed: the signed r2-site-key-install job names the site's file-node agent, and the job's pair wins
#       wrangler secret put CELL_FILE_AGENT_TOKEN      # OPTIONAL fallback: its bearer token (set both or neither)
#       R2_EXPECTED_ACCOUNT_ID (a var, hub#43 L7): the account id R2_PROVISION_API_TOKEN must belong to; the media ops refuse any other
#       MEDIA_SITE_SECRET (a secret, hub#222): at least 32 characters (openssl rand -hex 32). The root of every site's media credential
#         (POST /media/*); changing it invalidates every site's credential until media-site-credential-install runs again. The /media/*
#         routes and the media-* ops sign R2 requests with R2_PROVISION_API_TOKEN (its S3 form), so that token must be set too.
#       wrangler secret put CF_DNS_API_TOKEN           # Zone:DNS:Edit + Zone:Read (Direction-B dns-record-upsert) + Zone:Cache Purge (cache-purge) + Zone:Cache Rules:Edit (cache-rule-upsert) + Zone WAF:Edit (waf-rule-upsert) + Zone:SSL and Certificates:Edit (hub#46 custom-hostname-*) + Zone:Workers Routes:Edit (hub#133 worker-route-*) + Account:Workers KV Storage:Edit (hub#133 media-hostmap-*)
#       wrangler secret put CF_CUSTOM_HOSTNAME_ZONE    # hub#46: the agency zone NAME that holds its customers' custom hostnames, e.g. example.com (a secret so a redeploy keeps it)
#       wrangler secret put ANTHROPIC_API_KEY
#       wrangler secret put OPENROUTER_API_KEY
#
#   Self-hosted servers (hub#476, planning/58; only for an agency that runs cells on its own Ubuntu or Mac server):
#       wrangler secret put HOST_AGENT_MASTER_KEY      # at least 32 characters (openssl rand -hex 32). The root of every
#                                                      # host-agent token: token = HKDF-SHA256(this key, cellId). Only this
#                                                      # Worker holds it. Rotate: put a new value, then run host-repair for
#                                                      # each server (or the manual enrol again); until then the server's
#                                                      # host-agent refuses this Worker. Remove: only when no self-hosted
#                                                      # cell is left (the host-* VM ops stop working).
#     Per server N (1-99, the agency's own number for the server; the app records only N):
#       wrangler secret put SELF_HOSTED_<N>_SSH_KEY    # the server's ed25519 private key, unencrypted OpenSSH format
#                                                      # (ssh-keygen -t ed25519 -N ''). Add its public key to the login's
#                                                      # authorized_keys yourself. Used ONLY by host-ssh-check, host-bootstrap
#                                                      # and host-repair; never logged or returned.
#       wrangler secret put SELF_HOSTED_<N>_HOST_KEY   # the server's ED25519 host-key fingerprint, SHA256:… (from
#                                                      # ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub). The Worker refuses a
#                                                      # job naming another fingerprint and a server presenting another key.
#       Rotate the key: put a new SELF_HOSTED_<N>_SSH_KEY, add the new public key to authorized_keys, run
#         host-ssh-check, then remove the old public key. A new host key needs a new SELF_HOSTED_<N>_HOST_KEY and the
#         new fingerprint in the app's server form.
#       Remove: delete SELF_HOSTED_<N>_SSH_KEY, SELF_HOSTED_<N>_HOST_KEY and the authorized_keys line. The cells keep
#         running (they never use SSH after the bootstrap); host-repair is lost, the manual enrol path still works.
#     The installer pin (the platform cannot change it; host-bootstrap, host-repair and /enroll-host refuse any other):
#       wrangler secret put HOST_INSTALLER_ORIGIN      # https://<host> that serves /self-hosted/host-install-<sha256>.sh
#       wrangler secret put HOST_INSTALLER_SHA256S     # 1-4 installer sha256 values you accept, comma-separated; add a
#                                                      # release's sha256 after you read it, drop old ones after the update
#     The manual enrol path (a server Cloudflare cannot reach over SSH, e.g. behind NAT; open GET /enroll-host):
#       wrangler secret put HOST_ENROLL_CODE           # at least 32 characters, a NEW value for each enrolment (one-time;
#                                                      # a used value is refused). Delete it when no enrolment is pending.
#     (These are set as secrets, not [vars], so a redeploy of this shared wrangler.toml keeps them.)
#
# Deploy (needs `wrangler login` against the agency's Cloudflare account):
#   1. npm install
#   2. Set the secrets above (`wrangler secret put ...`).
#   3. npm run deploy      # wrangler deploy
#   4. Hit https://<worker>.workers.dev/validate until every result is green,
#      then POST /complete to signal onboarding done.

name = "agencydoubleyoup"
main = "src/index.ts"
compatibility_date = "2026-01-01"

[vars]
APP_BASE_URL = "https://app.doubleyoup.com"
# Optional branded-media vars (hub#133). Uncomment to override the defaults:
# MEDIA_WORKER_SCRIPT = "doubleyoup-media"
# MEDIA_HOSTMAP_KV_ID = "<32-hex id of your HOSTMAP namespace>"
# MEDIA_ACCOUNT_ID = "<32-hex id of the account of your media Worker>"

# ── Direction-B replay protection (Durable Object) ───────────────────────────
# NONCE_STORE is the single-use nonce store that makes a signed /actuate job
# actuatable at most once (src/nonce-store.ts). No per-account id is committed:
# `wrangler deploy` auto-provisions the DO in whichever agency account runs it,
# so this file stays identical across every agency deployment.
#
# NOTE: Durable Objects require the Workers PAID plan on the deploying account.
[[durable_objects.bindings]]
name = "NONCE_STORE"
class_name = "NonceStore"

# Applied automatically on `wrangler deploy`. `new_sqlite_classes` makes NonceStore
# a SQLite-backed DO (state.storage.sql), so spent nonces survive DO restarts/evictions.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["NonceStore"]
